[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-synthesizer"
version = "2.0.0"
description = "Generate astronomical synthetic observations from the command-line"
readme = "README.md"
authors = [{ name = "Joaquin Zamponi", email = "jzamponi@mpe.mpg.de" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
keywords = ["astronomy", "radiative-transfer", "synthetic-observations"]
dependencies = [
    "requests",
    "astropy >= 5.1",
    "matplotlib",
    "numpy",
    "scipy",
    "mpmath",
    "progressbar2",
    "aplpy",
    "h5py",
    "yt",
    "pyqt5",
    "mayavi",
]
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/jzamponi/synthesizer"

[project.scripts]
synthesizer = "synthesizer.parser:synthesizer"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E741", "B008", "B904", "B026", "B007"]

[tool.ruff.lint.per-file-ignores]
"synthesizer/synobs/templates/*" = ["F821", "F841", "E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = false
ignore_missing_imports = true
check_untyped_defs = false
disable_error_code = ["misc", "no-redef", "assignment", "var-annotated", "arg-type", "call-arg", "union-attr", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "astropy.*",
    "aplpy.*",
    "yt.*",
    "mayavi.*",
    "scipy.*",
    "progressbar.*",
    "h5py.*",
    "synthesizer.synobs.templates.*",
]
ignore_missing_imports = true
ignore_errors = true
